[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homography-kmeans"
version = "0.1.0"
description = "Scale-adaptive residual-driven homography K-Means for multi-plane correspondence segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "h5py>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
analysis = ["PyMuPDF>=1.24"]

[project.scripts]
homography-kmeans = "homography_kmeans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["homography_kmeans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
